name: Build and publish portfolio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: portfolio-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Publish compiled site to gh-pages
        shell: bash
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          touch dist/.nojekyll
          export GIT_INDEX_FILE="$RUNNER_TEMP/portfolio-pages-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.index"
          git read-tree --empty
          git --work-tree="$GITHUB_WORKSPACE/dist" add --all
          TREE=$(git write-tree)
          PARENT=()
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git fetch origin gh-pages
            PARENT=(-p "$(git rev-parse FETCH_HEAD)")
          fi
          COMMIT=$(git commit-tree "$TREE" "${PARENT[@]}" -m "Publish portfolio ${GITHUB_SHA}")
          git push origin "$COMMIT:refs/heads/gh-pages"
      - name: Request Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --silent
